name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      # voussoir depends on the sibling ctxforge repo (editable path source in
      # [tool.uv.sources]: path = "../ctxforge"). actions/checkout refuses to
      # write outside $GITHUB_WORKSPACE, so clone it manually into the sibling
      # location (`../ctxforge` relative to the repo root). Pin to a known-good
      # commit; bump when ctxforge changes its public Protocols.
      - name: Checkout ctxforge (sibling dependency)
        run: |
          git init ../ctxforge
          git -C ../ctxforge remote add origin https://github.com/efathom/ctxforge.git
          git -C ../ctxforge fetch --quiet --depth 1 origin 59779203e054f8744c9f5a763acb93e74c3254a3
          git -C ../ctxforge checkout --quiet FETCH_HEAD

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        # mem-sqlite (sentence-transformers/torch) is deliberately excluded to
        # keep CI fast; the affected tests skip gracefully via importorskip.
        run: uv sync --extra dev --extra a2a --extra mcp

      - name: Test
        run: uv run pytest -q --tb=short

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Checkout ctxforge (sibling dependency)
        run: |
          git init ../ctxforge
          git -C ../ctxforge remote add origin https://github.com/efathom/ctxforge.git
          git -C ../ctxforge fetch --quiet --depth 1 origin 59779203e054f8744c9f5a763acb93e74c3254a3
          git -C ../ctxforge checkout --quiet FETCH_HEAD
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --extra dev --extra a2a --extra mcp
      - name: Ruff
        run: uv run ruff check src tests
      - name: Format check
        run: uv run black --check src tests
      - name: Type check (mypy)
        run: uv run mypy src/voussoir
      # `mkdocs build --strict` lived only in the Makefile, so a broken docs
      # reference could land on main unnoticed (audit, minor).
      - name: Docs build (strict)
        run: uv run mkdocs build --strict
