repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
      - id: debug-statements

  # Keep this rev in step with the `ruff` floor in pyproject's [dev] extra.
  # It sat on v0.4.10 while dev deps required >=0.16.2 — twelve minor versions
  # of rule drift between the local hook and CI (audit, minor). black is
  # exactly pinned below for the same reason.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff
        args: [--fix]

  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 24.4.2
    hooks:
      - id: black
        language_version: python3.12
