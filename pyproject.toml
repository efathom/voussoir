[build-system]
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"

[project]
name = "voussoir"
version = "1.3.0"
description = "Default-runnable, highly-extensible LLM agent framework — the wedge stone in your agent arch."
authors = [{ name = "voussoir Team" }]
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
keywords = ["llm", "agents", "a2a", "mcp", "security", "guardrails", "prompt-injection"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.13.4",
  "anyio>=4.14.2",
  "httpx>=0.28.1",
  "structlog>=26.1.0",
  "anthropic>=0.121.0",
  "ctxforge", # local editable install — see [tool.uv.sources]
  "pyyaml>=6.0.3",
  # PyJWT + cryptography are base deps: voussoir/__init__ eagerly imports
  # AgentRef (a2a/agent_ref.py → `import jwt`) and KeyProvider
  # (a2a/keys.py → `from cryptography...`). Before this move, `pip install
  # voussoir` without the [a2a] extra could not even `import voussoir`.
  "PyJWT>=2.13.0",
  "cryptography>=50.0.0",
  # Phase 5 Task C1: OTel moved from [observability] extra to base deps.
  # Every voussoir install ships tracing + OTLP HTTP export out of the box.
  "opentelemetry-api>=1.44.0",
  "opentelemetry-sdk>=1.44.0",
  "opentelemetry-exporter-otlp-proto-http>=1.44.0",
  # Phase 6 A7: OS keychain support for KeychainCredentialBroker.
  "keyring>=25.7.0",
  # Phase 6 B1: CLI entry point — must be a base dep (not dev-only).
  "click>=8.4.2",
]

[tool.uv.sources]
# Pin ctxforge to the sibling checkout so uv doesn't accidentally pull the
# unrelated ctxforge==1.4.x package from PyPI (different project, same name).
ctxforge = { path = "../ctxforge", editable = true }

[project.scripts]
voussoir = "voussoir.cli.main:main"

[project.optional-dependencies]
# Note: `httpx` is in base deps; not re-listed in extras that need it.
mcp           = ["mcp>=2.0.0", "httpx2>=2.5.0"]
a2a           = ["fastapi>=0.141.1", "uvicorn>=0.52.1"]
mem-sqlite    = ["sentence-transformers>=5.7.0", "sqlite-vec>=0.1.9"]
mem-postgres  = ["psycopg[binary]>=3.3.4"]
mem-qdrant    = ["qdrant-client>=1.19.0"]
yase          = ["grpcio>=1.83.0"]
mem-graph     = ["neo4j>=6.2.0", "qdrant-client>=1.19.0"]
tokenizers    = ["tiktoken>=0.13.0"]
observability = []  # Phase 5 Task C1: OTel moved to base deps. Kept as an empty
                   # alias so `pip install voussoir[observability]` from pre-Phase-5
                   # docs keeps working without error.
testing = [
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
]
all = [
  "voussoir[mcp,a2a,mem-sqlite,mem-postgres,mem-qdrant,yase,mem-graph,observability,tokenizers]",
]
dev = [
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "pytest-cov>=7.1.0",
  "respx>=0.23.1",
  "ruff>=0.16.2",
  # Pin black exactly to match .pre-commit-config.yaml so local and CI
  # formatting agree (newer black majors change layout rules and cause churn).
  "black==24.4.2",
  "mypy>=2.3.0",
  "pre-commit>=4.6.2",
  # Phase 6 C1: docs toolchain
  "mkdocs-material>=9.7.7",
  "mkdocstrings[python]>=1.0.6",
  "types-pyyaml>=6.0.12.20260724",
]

[tool.hatch.build.targets.wheel]
packages = ["src/voussoir"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=voussoir --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "ASYNC"]
ignore = ["E501"]  # black handles line length

[tool.ruff.lint.isort]
known-first-party = ["voussoir"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Pre-commit's isolated mypy env can't see editable-installed ctxforge, so
# its Protocol types fall back to Any. We still subclass them
# (IMemoryStore, ISessionStore, IVectorStore) explicitly — the local .venv mypy
# reads the real types via py.typed, and the pre-commit gate stays useful for
# everything else. Scope the strict-mode relaxation to JUST the three modules
# that subclass ctxforge Protocols, so other accidental untyped-subclass bugs
# still fire.
module = [
    "voussoir.memory.adapter",
    "voussoir.memory.backends.sqlite",
    "voussoir.memory.backends.qdrant",
]
disallow_subclassing_any = false

[[tool.mypy.overrides]]
# Pre-commit's isolated mypy env has no editable ctxforge install. The .venv
# mypy DOES (ctxforge ships py.typed since 2026-05) and gets full type checks.
module = "ctxforge.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "voussoir.llm.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "anthropic.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Phase 5 Tranche B Task B2 lands DefaultGuardrailChain + bind_default_guardrails
# which lazy-imports the built-in guardrails. Those modules ship in Task B3.
# Until B3 lands, mypy can't resolve the imports; with this override the lazy
# imports stay clean (no `# type: ignore` per call site). Once B3 ships, the
# modules exist and the override becomes a no-op (mypy will type-check the
# real members).
module = "voussoir.guardrails.builtin.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Phase 6 A7: keyring is an optional runtime dep (installed in prod but not in
# the mypy/pre-commit isolated env). The lazy import in KeychainCredentialBroker
# is the only caller; this override keeps the module clean without per-site
# `# type: ignore`.
module = "keyring"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Phase 6 B2: starter templates are user-facing scaffold code, not library code.
# They use Agent.run() which is correct at runtime but IDelegate (the registry
# return type) only exposes .delegate(). Ignoring errors in the templates keeps
# the library's strict-mode clean without adding type-ignore comments that would
# confuse users copying the template.
module = "voussoir.templates.*"
ignore_errors = true

[[tool.mypy.overrides]]
# Optional runtime deps that aren't installed in the mypy/pre-commit isolated
# env. Imported lazily (or, in the case of tiktoken, attempted-and-fallen-back)
# so the library stays importable without them. Keep strict mode clean without
# per-site `# type: ignore`.
module = [
    "tiktoken",
    "qdrant_client",
    "qdrant_client.*",
    "sentence_transformers",
]
ignore_missing_imports = true
