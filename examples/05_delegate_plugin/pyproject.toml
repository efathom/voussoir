[project]
name = "example-plugin"
version = "0.1.0"
description = "Phase 4d canonical example: a voussoir.delegates entry-point plugin"
requires-python = ">=3.13"
dependencies = ["voussoir"]

[project.entry-points."voussoir.delegates"]
example_plugin_agent = "example_plugin:make_plugin_agent"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/example_plugin"]
